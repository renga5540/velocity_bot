<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VELOCITY PRO 10B - Symbol Search Exchange List</title><script src="https://s3.tradingview.com/tv.js"></script><style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#030a14;color:#fff;font-family:Arial}
.h{background:linear-gradient(90deg,#050e26,#14306a);border-bottom:3px solid #39ff14;padding:10px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;position:sticky;top:0;z-index:300}
.logo{font-weight:900;font-size:18px}.logo b{color:#39ff14}
.pill{background:#0e1a33;border:1px solid #1e3a5f;padding:4px 9px;border-radius:20px;font-size:10px}
.main{display:grid;grid-template-columns:1fr 460px;gap:10px;padding:10px}@media(max-width:1100px){.main{grid-template-columns:1fr}}
.card{background:#0a1428;border:1px solid #1a2f50;border-radius:14px;padding:10px}#tv{height:520px;border-radius:10px;overflow:hidden}

/* YOUR PHOTO - Symbol search exact */
.sym-search-box{background:#fff;color:#000;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px #000;padding-bottom:10px}
.search-top{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid #eee}
.search-top input{flex:1;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#f5f6f8}
.tabs{display:flex;gap:8px;padding:10px 14px;overflow:auto;flex-wrap:nowrap}.tab{padding:6px 12px;border-radius:20px;background:#f1f3f6;color:#555;font-size:12px;cursor:pointer;white-space:nowrap;font-weight:600}.tab.a{background:#000;color:#fff}
.sub{display:flex;gap:15px;padding:6px 14px;font-size:12px;color:#666}
.sym-list{max-height:520px;overflow:auto}
.sym-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border:1px solid transparent;cursor:pointer}.sym-row:hover{background:#f6f7f8}.sym-row.active{border:1px solid #000;border-radius:8px;background:#fff}
.sym-left{display:flex;align-items:center;gap:10px}.icon{width:28px;height:28px;border-radius:50%;background:#f7931a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px}
.btc{color:#2962ff;font-weight:700}.name{color:#2962ff;font-size:13px}
.right{font-size:11px;color:#777;display:flex;align-items:center;gap:6px}.ex{font-weight:700;color:#000}.badge{width:20px;height:20px;border-radius:50%;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}
</style></head><body>
<div class="h"><div class="logo">⬢ NEURALTRADER <b>PRO 10B</b> • 600 YEARS 1426-2026 • WORLD FIRST</div><div style="display:flex;gap:5px"><span class="pill" id="clock"></span><span class="pill">SYMBOL SEARCH WITH EXCHANGE</span></div></div>

<div class="main">
<div><div class="card"><h3 style="color:#39ff14;font-size:12px" id="sn">BINANCE:BTCUSDT • Click any BTCUSD exchange → Chart Loads</h3><div id="tv" style="margin-top:8px"></div><div style="margin-top:8px">Live: <b id="lp" style="color:#39ff14;font-size:20px">BTCUSD</b> <span id="exLabel" style="color:#8aa">Binance</span></div></div></div>

<div>
<div class="sym-search-box">
<div style="padding:12px 16px;font-weight:800;font-size:18px;display:flex;justify-content:space-between">Symbol search <span style="cursor:pointer">✕</span></div>
<div class="search-top"><span style="font-size:18px">🔍</span><input id="searchInput" value="BTCUSD" placeholder="BTCUSD"><span style="cursor:pointer">⊗</span><span>⌨️</span></div>
<div class="tabs" id="tabs"></div>
<div class="sub"><span>All sources ▼</span><span>All types ▼</span><span>All exchange types ▼</span></div>
<div class="sym-list" id="symList"></div>
<div style="text-align:center;padding:10px;color:#888;font-size:11px">Search using ISIN and CUSIP codes</div>
</div>
</div>
</div>

<script>
let symbols=[
{s:"BTCUSD",name:"Bitcoin / U.S. dollar",desc:"spot crypto defi",ex:"Bitstamp",badge:"B",color:"#f7931a",tv:"BITSTAMP:BTCUSD",type:"Crypto"},
{s:"BTCUSD",name:"Bitcoin / US Dollar",desc:"spot crypto defi",ex:"Coinbase",badge:"C",color:"#0052ff",tv:"COINBASE:BTCUSD",type:"Crypto"},
{s:"BTCUSD",name:"Bitcoin all time history index",desc:"index crypto",ex:"INDEX",badge:"TV",color:"#000",tv:"INDEX:BTCUSD",type:"Crypto"},
{s:"BTCUSD",name:"Bitcoin",desc:"spot crypto",ex:"CRYPTO",badge:"TV",color:"#2962ff",tv:"CRYPTO:BTCUSD",type:"Crypto"},
{s:"BTCUSD",name:"Bitcoin / USD",desc:"spot crypto defi",ex:"Binance",badge:"B",color:"#f3ba2f",tv:"BINANCE:BTCUSD",type:"Crypto"},
{s:"BTCUSD",name:"Bitcoin / U. S. Dollar",desc:"spot crypto defi",ex:"Kraken",badge:"K",color:"#5741f8",tv:"KRAKEN:BTCUSD",type:"Crypto"},
{s:"BTCUSD",name:"Bitcoin / Dollar",desc:"spot crypto defi",ex:"Bitfinex",badge:"B",color:"#1a5a2a",tv:"BITFINEX:BTCUSD",type:"Crypto"},
{s:"NVDA",name:"NVIDIA Corporation",desc:"stock",ex:"NASDAQ",badge:"N",color:"#76b900",tv:"NASDAQ:NVDA",type:"Stocks"},
{s:"TSLA",name:"Tesla, Inc.",desc:"stock",ex:"NASDAQ",badge:"T",color:"#e31937",tv:"NASDAQ:TSLA",type:"Stocks"},
{s:"AAPL",name:"Apple Inc.",desc:"stock",ex:"NASDAQ",badge:"A",color:"#000",tv:"NASDAQ:AAPL",type:"Stocks"},
{s:"RELIANCE",name:"Reliance Industries Ltd",desc:"stock",ex:"NSE",badge:"R",color:"#0033a0",tv:"NSE:RELIANCE",type:"Stocks"},
{s:"NIFTY",name:"Nifty 50",desc:"index",ex:"NSE",badge:"N",color:"#39ff14",tv:"NSE:NIFTY",type:"Indices"},
{s:"EUR/USD",name:"Euro / US Dollar",desc:"forex",ex:"FOREX",badge:"F",color:"#003399",tv:"FX:EURUSD",type:"Forex"},
{s:"GOLD",name:"Gold Spot",desc:"futures",ex:"MCX",badge:"G",color:"#FFD700",tv:"OANDA:XAUUSD",type:"Futures"},
];

let cur="Crypto";
let cats=["All","Stocks","Funds","Futures","Forex","Crypto","Indices","Bonds","Economy","Options"];

function renderTabs(){
 document.getElementById("tabs").innerHTML=cats.map(c=>`<div class="tab ${c===cur?'a':''}" onclick="setCat('${c}')">${c}</div>`).join('');
}
window.setCat=function(c){cur=c; renderTabs(); renderList();}

function renderList(){
 let q=document.getElementById("searchInput").value.toUpperCase();
 let list=symbols.filter(s=>{
   if(cur!=="All" && s.type!==cur) return false;
   if(q && !s.s.includes(q) && !s.name.toUpperCase().includes(q)) return false;
   return true;
 });
 let h=""; list.forEach((s,i)=>{
   h+=`<div class="sym-row ${i===0?'active':''}" onclick="loadSym('${s.tv}','${s.s}','${s.name}','${s.ex}')">
   <div class="sym-left"><div class="icon" style="background:${s.color}">₿</div><div><span class="btc">${s.s}</span> <span class="name">${s.name}</span></div></div>
   <div class="right"><span>${s.desc}</span> <b class="ex">${s.ex}</b> <div class="badge" style="background:${s.ex==='Bitstamp'?'#000':s.ex==='Coinbase'?'#0052ff':s.ex==='INDEX'?'#000':'#f3ba2f'}">${s.badge}</div></div>
   </div>`;
 });
 document.getElementById("symList").innerHTML=h;
}

window.loadSym=function(tv, short, name, ex){
 document.getElementById("tv").innerHTML="";
 new TradingView.widget({autosize:true,symbol:tv,interval:"60",timezone:"Asia/Kolkata",theme:"dark",style:"1",locale:"en",container_id:"tv",studies:["STD;EMA","STD;RSI","STD;MACD","STD;Bollinger_Bands"]});
 document.getElementById("sn").innerText=tv+" • "+name+" • 600Y Backtest • AI v12.0";
 document.getElementById("lp").innerText=short+" - "+ex+" - "+tv;
 document.getElementById("exLabel").innerText=ex+" • "+name;
 document.getElementById("symList").querySelectorAll(".sym-row").forEach(r=>r.classList.remove("active"));
 event.currentTarget.classList.add("active");
}

document.getElementById("searchInput").addEventListener("input", renderList);
setInterval(()=>{document.getElementById("clock").innerText=new Date().toLocaleString('en-IN')},1000);
renderTabs(); renderList(); loadSym("BITSTAMP:BTCUSD","BTCUSD","Bitcoin / U.S. dollar","Bitstamp");
</script></body></html>
